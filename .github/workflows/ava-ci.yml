# CI propre au fork Ava.
#
# ⚠ POURQUOI UN FICHIER DEDIE PLUTOT QUE D'AJOUTER `ava-main` AUX WORKFLOWS EXISTANTS.
#   Les 12 workflows herites d'OpenJarvis se declenchent tous sur `main` — la branche
#   qui miroite l'amont. Notre travail vit sur `ava-main` : ils ne l'ont donc JAMAIS
#   analyse. Une CI qui ne s'execute pas ressemble beaucoup a une CI qui passe.
#   Y ajouter notre branche marcherait... jusqu'a la prochaine synchronisation amont, ou
#   chaque fichier modifie deviendrait un conflit a resoudre. Ce fichier-ci n'existe pas
#   en amont : il ne peut pas entrer en conflit. Meme raisonnement que `ava_extensions/`,
#   qui a encaisse 353 commits amont sans une seule collision.
name: ava-ci

on:
  push:
    branches: [ava-main, 'ava/**']
  pull_request:
    branches: [ava-main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ava-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extensions:
    name: Extensions Ava (tests + invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # ⚠ La version vient de `.python-version` (valeur 3.12), PAS du systeme. La VM de
      #   production suit le meme fichier ; compiler ou tester sur une autre version
      #   validerait un environnement que personne n'execute.
      - name: Synchroniser l'environnement
        run: |
          uv python install
          uv sync --extra dev --extra server --extra inference-cloud

      # ⚠ Les tests des extensions AVANT ceux de l'amont : ils sont a nous, ils sont
      #   rapides, et c'est la zone ou nos regressions apparaissent.
      - name: Tests des extensions Ava
        run: uv run pytest ava_extensions/tests/ -q

      # ⚠ ET LES MEMES TESTS APRES CEUX DE L'AMONT — ce n'est pas une redondance.
      #   Un test peut passer SEUL et echouer dans une suite complete : c'est arrive le
      #   2026-08-04. `tests/conftest.py` (herite d'OpenJarvis) declare une fixture
      #   `autouse=True` qui VIDE tous les registres avant chaque test, `SpeechRegistry`
      #   compris — nos tests en heritaient et le backend s'y trouvait absent.
      #   Un job qui ne lance que `ava_extensions/tests/` en isolation ne voit JAMAIS
      #   cette classe de defaut. Or un test rouge une fois sur deux est pire qu'un test
      #   absent : on apprend a ignorer la couleur.
      #   `tests/speech` est choisi parce que c'est precisement lui qui declenchait le
      #   nettoyage fatal ; le lancer entier serait long pour un gain nul.
      - name: "Tests des extensions APRES ceux de l'amont (isolation)"
        run: uv run pytest tests/speech ava_extensions/tests/ -q --deselect tests/speech/test_tts_backends.py::test_kokoro_health_false_without_package

      # ── Invariants du fork — ce qu'une synchronisation amont peut casser en silence ──
      - name: "Invariant : le micro reste autorise (microphone=(self))"
        run: |
          # ⚠ CONFLIT RECURRENT, ET LE PLUS DANGEREUX DU DEPOT. L'amont pose
          #   `microphone=()` dans Permissions-Policy, ce qui DESACTIVE la capture vocale
          #   du navigateur. Sur un assistant VOCAL, le resoudre a la va-vite coupe le
          #   micro partout — sans erreur : le bouton reagit, `getUserMedia` echoue en
          #   NotAllowedError, et l'on part chercher une autorisation navigateur.
          grep -q 'microphone=(self)' src/openjarvis/server/middleware.py || {
            echo "::error file=src/openjarvis/server/middleware.py::microphone=(self) a disparu — la dictee d'Ava est morte"
            exit 1
          }

      - name: "Invariant : boot.py charge toutes les extensions"
        run: |
          # ⚠ Un backend ou un outil present sur le disque mais jamais IMPORTE est du
          #   code mort que rien ne signale : le decorateur d'enregistrement ne s'execute
          #   pas, le registre reste vide, et aucune erreur n'est levee.
          # ⚠ LES HUIT MODULES, pas quatre — l'audit du 2026-08-04 a relevé que ce pas
          #   s'intitule « boot.py charge TOUTES les extensions » alors qu'il n'en
          #   vérifiait que la moitié. Un contrôle qui affirme couvrir un ensemble et n'en
          #   couvre qu'une partie est pire qu'un contrôle absent : on cesse de vérifier
          #   à la main ce qu'on le croit vérifier.
          for module in kokoro_fr_tts openai_whisper_ava_stt anthropic_enhancements \
                        system_prompt_loader traces_observabilite avalon_status \
                        perception \
                        home_assistant memoire routing_probe; do
            grep -q "$module" ava_extensions/boot.py || {
              echo "::error file=ava_extensions/boot.py::$module n'est plus importe — il ne s'enregistrera jamais"
              exit 1
            }
          done

      - name: "Invariant : l'outil Home Assistant reste en LECTURE SEULE"
        run: |
          # ⚠ INVARIANT DE SECURITE. Le jeton HA autorise l'ECRITURE (allumer, chauffer,
          #   ouvrir). Ava execute du code tiers depuis la DMZ : aucun chemin d'ecriture
          #   ne doit apparaitre ici, meme par inadvertance lors d'un merge.
          #
          # ⚠ CE PAS ETAIT UN `grep` AVEUGLE JUSQU'AU 2026-08-04, et c'est le pire etat
          #   possible pour un garde-fou : present, intitule « INVARIANT DE SECURITE »,
          #   vert a chaque execution, et incapable de voir une ecriture.
          #   Il cherchait `"POST"`, `requests.post` et `method=POST` — or ce fichier
          #   n'utilise NI `requests` NI de verbe explicite : uniquement `urllib`, ou
          #   **passer `data=` suffit a basculer en POST**. Mesure : le grep rend 1
          #   (aucune correspondance) sur
          #     `urllib.request.Request(url, data=json.dumps(charge).encode())`
          #   c'est-a-dire sur une ecriture parfaitement fonctionnelle.
          #   Le detecteur AST le remplace : il raisonne sur la STRUCTURE de l'appel,
          #   resout les alias d'import, et il est lui-meme couvert par 19 tests
          #   (`ava_extensions/tests/test_lecture_seule.py`) — un garde-fou non teste
          #   se comporte exactement comme un garde-fou qui marche.
          uv run python scripts/verifier-lecture-seule.py ava_extensions/skills/home_assistant.py

      - name: "Invariant : Ava ne detient AUCUN jeton Matrix"
        run: |
          # ⚠ INVARIANT DE SECURITE, et c'est le cœur du montage de la parole.
          #   Ava vit en DMZ et execute du code communautaire ainsi qu'un LLM. Elle parle
          #   par `POST /api/v1/ava/message` du control plane, qui detient le jeton Matrix
          #   pour `matrix_alerting` — le jeton ne quitte JAMAIS le CP. Ava ne connait
          #   qu'un jeton de PAROLE dont le seul pouvoir est d'emettre dans un salon fixe.
          #   Cette infrastructure a deja refuse le montage inverse (jeton Matrix sur une
          #   VM exposee) pour Home Assistant, le 2026-08-02. Si un jour quelqu'un
          #   « simplifie » en appelant Matrix en direct, tout le benefice disparait —
          #   Ava pourrait alors LIRE les salons et usurper l'identite du bot.
          if grep -rnE "_matrix/client|matrix\.avalon-network|m\.room\.message" \
               ava_extensions/ --include="*.py" | grep -v "^ava_extensions/tests/"; then
            echo "::error::appel Matrix DIRECT detecte — la parole doit passer par le control plane"
            exit 1
          fi

      # ⚠ `--select F` (pyflakes) EST BLOQUANT, `E501` NE L'EST PAS — et la distinction
      #   n'est pas du confort. C'est `F821` qui a trouvé, le 2026-08-04, un
      #   `CP_V2_URL` inexistant dans le gestionnaire d'erreur d'`avalon_status` : le
      #   jour où le control plane serait devenu injoignable, l'outil aurait levé un
      #   `NameError` AU LIEU d'afficher son message. Un gestionnaire d'erreur cassé ne
      #   se voit jamais tant que l'erreur ne survient pas — donc jamais avant le pire
      #   moment. Voilà ce qu'on veut bloquer.
      #   `E501` signale des COMMENTAIRES longs, volontairement denses dans ce dépôt
      #   (ils portent le « pourquoi », c'est leur travail). Le rendre bloquant
      #   pousserait à raccourcir des explications pour faire verdir un job — soit
      #   exactement l'inverse du but. Le code amont lui-même en compte 5.
      - name: "Lint des extensions (bugs réels — bloquant)"
        run: uv run ruff check ava_extensions/ --select F,E7,E9

      - name: "Style des extensions (informatif)"
        run: uv run ruff check ava_extensions/ --select E501 || true

      - name: Formatage
        run: uv run ruff format --check ava_extensions/

  frontend:
    name: Frontend (types + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Verification des types
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # ⚠ CE CONTROLE EXISTE PARCE QUE LE DEFAUT A ETE VECU (2026-08-03). `index.html`
      #   etait precache par le service worker : les deploiements n'atteignaient JAMAIS
      #   les telephones, le serveur servant pourtant le bon bundle. Un deploiement qui
      #   n'atteint personne se lit exactement comme un deploiement reussi.
      #   La regle `NetworkFirst` censee l'empecher existait deja — et etait inerte, le
      #   precache ayant la priorite sur le runtimeCaching.
      - name: "Invariant PWA : index.html hors du precache"
        run: |
          SW=../src/openjarvis/server/static/sw.js
          test -f "$SW" || { echo "::error::sw.js absent — le build PWA a echoue"; exit 1; }
          if grep -q 'index\.html' "$SW"; then
            echo "::error::index.html est precache par le service worker : les deploiements n'atteindront pas les navigateurs deja venus"
            exit 1
          fi
          grep -q 'ava-html' "$SW" || {
            echo "::error::le cache runtime NetworkFirst des navigations a disparu"
            exit 1
          }
